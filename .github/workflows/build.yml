name: AETHRA OS 16 - Lavender

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip
          git config --global user.name "AETHRA"
          git config --global user.email "aethra@os16.id"

      - name: Sync Project Infinity X A16
        run: |
          mkdir aethra && cd aethra
          # Manifest Infinity X Android 16
          repo init -u https://github.com/ProjectInfinity-X/manifest -b 16 --git-lfs --depth=1
          # Clone device tree lavender dari Infinity X
          git clone https://github.com/ProjectInfinity-X-Devices/device_xiaomi_lavender -b 16 device/xiaomi/lavender --depth=1
          git clone https://github.com/ProjectInfinity-X-Devices/device_xiaomi_sdm660-common -b 16 device/xiaomi/sdm660-common --depth=1
          git clone https://github.com/ProjectInfinity-X-Devices/kernel_xiaomi_sdm660 -b 16 kernel/xiaomi/sdm660 --depth=1 || git clone https://github.com/LineageOS/android_kernel_xiaomi_sdm660 kernel/xiaomi/sdm660 -b lineage-22.2 --depth=1
          git clone https://github.com/ProjectInfinity-X-Devices/vendor_xiaomi_lavender -b 16 vendor/xiaomi/lavender --depth=1 || git clone https://github.com/TheMuppets/proprietary_vendor_xiaomi vendor/xiaomi -b lineage-22.2 --depth=1
          
          repo sync -c -j$(nproc --all) --force-sync --no-tags --no-clone-bundle --optimized-fetch --prune

      - name: Rebrand to AETHRA OS 16
        run: |
          cd aethra
          # Ganti branding Infinity jadi AETHRA
          echo "AETHRA OS 16 - Lavender" > vendor/infinity/BUILD.txt || true
          sed -i 's/Infinity/AETHRA/g' vendor/infinity/config/common.mk 2>/dev/null || true
          sed -i 's/INFINITY/AETHRA/g' vendor/infinity/config/common.mk 2>/dev/null || true

      - name: Build
        run: |
          cd aethra
          source build/envsetup.sh
          lunch infinity_lavender-userdebug
          mka bacon -j$(nproc --all)

      - name: Upload AETHRA OS 16
        uses: actions/upload-artifact@v4
        with:
          name: AETHRA-OS-16-lavender-INF
          path: aethra/out/target/product/lavender/*2026*.zip
